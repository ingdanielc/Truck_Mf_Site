<div
  class="offcanvas-overlay"
  [class.show]="isOpen"
  (click)="onClose()"
  onkeypress
></div>

<div class="offcanvas offcanvas-end shadow" [class.show]="isOpen" tabindex="-1">
  <div class="offcanvas-header border-bottom">
    <div class="d-flex align-items-center gap-2">
      <i class="fa-solid fa-bell text-primary fs-5"></i>
      <h5 class="offcanvas-title fw-bold">Notificaciones</h5>
    </div>
    <button
      type="button"
      class="btn-close mt-0"
      (click)="onClose()"
      aria-label="cerrar"
    ></button>
  </div>

  <div class="offcanvas-body p-0">
    <app-g-push-prompt variant="panel"></app-g-push-prompt>

    <div
      class="d-flex justify-content-between align-items-center px-3 py-2 border-bottom bg-body-tertiary"
    >
      <span class="small text-secondary fw-medium">Recientes</span>
      <div class="action-buttons d-flex gap-2">
        <button
          class="btn btn-link btn-sm text-decoration-none p-0 smallest"
          (click)="onMarkAllRead()"
        >
          Marcar todo como leído
        </button>
        <span class="text-secondary opacity-50 smallest">|</span>
        <button
          class="btn btn-link btn-sm text-decoration-none p-0 text-danger smallest"
          (click)="onClearAll()"
        >
          Limpiar todo
        </button>
      </div>
    </div>

    <div class="notifications-list custom-scrollbar overflow-auto h-100 pb-5">
      @if ((notifications$ | async)?.length === 0) {
        <div
          class="empty-state d-flex flex-column align-items-center justify-content-center mt-5 opacity-50"
        >
          <i class="fa-solid fa-bell-slash fs-1 mb-3"></i>
          <p class="small fw-medium">No tienes notificaciones</p>
        </div>
      } @else {
        @for (notification of notifications$ | async; track notification.id) {
          <app-g-notification-card
            [notification]="notification"
            (markRead)="onMarkRead($event)"
            (remove)="onRemove($event)"
          ></app-g-notification-card>
        }
      }
    </div>
  </div>

  <!-- Bajar la hoja equivale a "Cancelar": no se limpia nada. Queda anclada
       al panel, no a la pantalla: su `position: fixed` se resuelve contra el
       host, que lleva un `transform`. -->
  <g-confirm-sheet
    [open]="isConfirmOpen"
    [busy]="isClearing"
    title="¿Limpiar todas las notificaciones?"
    message="Esta acción no se puede deshacer. Se ocultarán todas las notificaciones actuales."
    icon="fa-solid fa-circle-exclamation"
    variant="warning"
    confirmLabel="Limpiar todo"
    (confirm)="confirmClearAll()"
    (cancel)="cancelClearAll()"
  ></g-confirm-sheet>
</div>
