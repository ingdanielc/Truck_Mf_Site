<div
  class="category-card px-3 py-2 rounded-4 d-flex flex-column align-items-center justify-content-center text-center cursor-pointer transition-all border h-100"
  [ngClass]="{
    'is-selected': selected,
    'is-new': isNew,
    'is-disabled': disabled,
    'bg-body': !selected && !isNew && !disabled,
  }"
  (click)="onClick()"
  onkeypress
>
  <div
    class="icon-shape rounded-circle d-flex align-items-center justify-content-center mb-1"
    [ngClass]="iconClasses"
  >
    <i [class]="icon"></i>
  </div>
  <span
    class="small fw-medium"
    style="line-height: 1.15"
    [ngClass]="{
      'text-body': !selected && !isNew,
      'text-white': selected && !isNew,
      'text-primary fw-bold': isNew,
    }"
  >
    {{ name }}
  </span>
</div>
